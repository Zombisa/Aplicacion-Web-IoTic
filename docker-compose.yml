ervices:
  db:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - web

  backend:
    build: ./Backend
    container_name: django_backend
    command: >
      sh -c "
      until pg_isready -h db -U ${DB_USER}; do
        echo 'Esperando a Postgres...'
        sleep 2
      done &&
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "
    volumes:
      - ./Backend:/app
    environment:
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
      DEBUG: ${DEBUG}
      DJANGO_SETTINGS_MODULE: backend.settings
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - web

  frontend:
    build: ./Frontend/Web-IoTic-Front
    container_name: angular_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
  networks:
      - web

volumes:
  postgres_data:

networks:
  web:
    driver: bridge

